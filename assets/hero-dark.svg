<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="최원 (MYSO-KR). 모두의오늘 대표 · 개발자. 필요한 서비스를 직접 만들고 운영합니다. 프로필 사진과 모두의오늘 마크. 누르면 GitHub @myso-kr 프로필로 이동"><title>최원 (MYSO-KR). 모두의오늘 대표 · 개발자. 필요한 서비스를 직접 만들고 운영합니다. 프로필 사진과 모두의오늘 마크. 누르면 GitHub @myso-kr 프로필로 이동</title><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,'Segoe UI',sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'D2Coding',monospace} @keyframes dr{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,25px)}} .au1{animation:dr 14s ease-in-out infinite} .au2{animation:dr 18s ease-in-out infinite reverse} .au3{animation:dr 22s ease-in-out infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
