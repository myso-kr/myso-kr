<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="최근 활동 – 공개 저장소 커밋 · 기준 2026-11-05 09:02 KST. 1) jekyll-theme-modootoday: release: 1.5.0 (7분 전). 2) jekyll-theme-modootoday: fix(usability): error pages need no twin, footer columns are not landmarks, the skip link passes the sidebar (54분 전). 3) jekyll-theme-modootoday: fix(chrome): search hints, snippet marks, the doc CTA rule and one disclosure marker (54분 전). 4) pmcp: chore: release pmcp 0.24.1 (5시간 전). 5) pmcp: perf(git): git affected caches source import facts by blob id and skips unneeded work (5시간 전). 6) pmcp: feat(lease): heavy.log and usage records name the variable that carried a lease skip (5시간 전). 7) specfold: release: 0.7.1 (1일 전). 8) specfold: fix: context at the root, enabled-type hints, JSON lists, required fields, pending successors (1일 전)."><title>최근 활동 – 공개 저장소 커밋 · 기준 2026-11-05 09:02 KST. 1) jekyll-theme-modootoday: release: 1.5.0 (7분 전). 2) jekyll-theme-modootoday: fix(usability): error pages need no twin, footer columns are not landmarks, the skip link passes the sidebar (54분 전). 3) jekyll-theme-modootoday: fix(chrome): search hints, snippet marks, the doc CTA rule and one disclosure marker (54분 전). 4) pmcp: chore: release pmcp 0.24.1 (5시간 전). 5) pmcp: perf(git): git affected caches source import facts by blob id and skips unneeded work (5시간 전). 6) pmcp: feat(lease): heavy.log and usage records name the variable that carried a lease skip (5시간 전). 7) specfold: release: 0.7.1 (1일 전). 8) specfold: fix: context at the root, enabled-type hints, JSON lists, required fields, pending successors (1일 전).</title>
